function icon(k){if(k==='clock')return '<div class="ios-clock-icon"><span class="clock-hand hour"></span><span class="clock-hand minute"></span><span class="clock-center"></span></div>';if(k==='calendar')return '<div class="ios-calendar-icon"><small>목요일</small><strong>22</strong></div>';if(k==='notes')return '<img alt="메모" src="'+notesIconData+'">';return embeddedAppIcons[k]?`<img src="${embeddedAppIcons[k]}">`:({notes:'📝',kakao:'💬',safari:'🧭',messages:'💬',phone:'☎️'}[k]||'◻️')}
function appButton(n,k,label=true){return `<button class="app" onclick="openApp('${k}')"><div class="appicon">${icon(k)}</div>${label?n:''}</button>`}
document.getElementById('apps').innerHTML=apps.map(a=>appButton(...a)).join('');document.getElementById('dock').innerHTML=[['전화','phone'],['메시지','messages'],['카카오톡','kakao'],['Safari','safari']].map(a=>appButton(...a,false)).join('');
function home(){document.getElementById('home').classList.add('active');document.getElementById('view').classList.remove('active')}
let skipNextPageTransition=false;
function show(html){const skipTransition=skipNextPageTransition;skipNextPageTransition=false;const page=document.getElementById('page');const wasOpen=document.getElementById('view').classList.contains('active');page.innerHTML=html;document.getElementById('home').classList.remove('active');document.getElementById('view').classList.add('active');page.classList.remove('page-enter');if(wasOpen&&!skipTransition){void page.offsetWidth;page.classList.add('page-enter')}else{page.classList.remove('page-enter')}}
function header(title,back='home()'){return `<div class="head"><button class="back" onclick="${back}">‹ 뒤로</button><b>${title}</b><span style="width:45px"></span></div>`}

let clockAlarmEnabled=[true,false];
function clock(){show(`<div class="clock-page"><div class="clock-top"><h1>알람</h1><button aria-label="알람 추가" onclick="clock()">＋</button></div><div class="clock-scroll"><div class="clock-subhead">알람</div>${[['06:30','알람'],['07:00','재관이 깨우기']].map(([time,label],i)=>`<div class="clock-alarm ${clockAlarmEnabled[i]?'':'off'}"><div><div class="clock-alarm-time">${time}</div><div class="clock-alarm-label">${label} · 월 화 수 목 금</div></div><button class="clock-switch ${clockAlarmEnabled[i]?'on':''}" role="switch" aria-checked="${clockAlarmEnabled[i]}" aria-label="${label} 알람 켜기 또는 끄기" onclick="toggleClockAlarm(${i})"></button></div>`).join('')}</div><div class="clock-tabs"><div class="clock-tab">세계 시계</div><div class="clock-tab selected">알람</div><div class="clock-tab">스톱워치</div><div class="clock-tab">타이머</div></div></div>`)}
function toggleClockAlarm(i){clockAlarmEnabled[i]=!clockAlarmEnabled[i];clock()}

 const paths={mute:'<rect x="15" y="3" width="10" height="23" rx="5" fill="currentColor" stroke="none"/><path d="M9 19v3a11 11 0 0 0 22 0v-3M20 33v5M14 38h12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>',keypad:'<g fill="currentColor" stroke="none"><circle cx="9" cy="9" r="3"/><circle cx="20" cy="9" r="3"/><circle cx="31" cy="9" r="3"/><circle cx="9" cy="20" r="3"/><circle cx="20" cy="20" r="3"/><circle cx="31" cy="20" r="3"/><circle cx="9" cy="31" r="3"/><circle cx="20" cy="31" r="3"/><circle cx="31" cy="31" r="3"/></g>',speaker:'<path d="M6 16h7l9-7v23l-9-7H6zM27 14q10 6 0 14M31 9q17 11 0 23"/>',add:'<path d="M20 5v30M5 20h30"/>',video:'<rect x="4" y="11" width="23" height="19" rx="4"/><path d="m27 17 9-5v17l-9-5"/>',contact:'<circle cx="20" cy="20" r="16"/><circle cx="20" cy="16" r="6"/><path d="M9 31q11-13 22 0"/>'};
 return '<svg viewBox="0 0 40 40" aria-hidden="true">'+paths[type]+'</svg>';

function renderJaegwanCall(){
 show('<div class="jaegwan-call"><div class="jaegwan-call-name">류재관</div><div class="jaegwan-call-timer" id="jaegwanTimer">연결 중...</div><div class="jaegwan-call-dialogue" id="jaegwanDialogue" aria-live="polite"></div><div class="jaegwan-call-controls">'+[['mute','소리 끔'],['keypad','키패드'],['speaker','스피커'],['add','통화 추가'],['video','FaceTime'],['contact','연락처']].map(([icon,label])=>'<div class="jaegwan-call-control '+icon+'"><span>'+jaegwanCallIcon(icon)+'</span>'+label+'</div>').join('')+'</div><button class="jaegwan-call-end" aria-label="통화 종료" onclick="finishJaegwanCall()">'+jaegwanPhoneSvg()+'</button></div>');
}
function startJaegwanCall(){
 clearJaegwanCallTimers();jaegwanCallConnected=false;renderJaegwanCall();
 jaegwanSchedule(()=>{
  jaegwanCallConnected=true;jaegwanCallStarted=Date.now();
  const timer=document.getElementById('jaegwanTimer');if(timer)timer.textContent='00:00';
  jaegwanCallInterval=setInterval(()=>{const el=document.getElementById('jaegwanTimer');if(!el){clearJaegwanCallTimers();return}const secs=Math.floor((Date.now()-jaegwanCallStarted)/1000);el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},150);
  jaegwanSchedule(()=>{const el=document.getElementById('jaegwanDialogue');if(el)el.textContent='요원님?'},3000);
  jaegwanSchedule(()=>{const el=document.getElementById('jaegwanDialogue');if(el)el.textContent='무슨 일 있으십니까?'},7000);
  jaegwanSchedule(finishJaegwanCall,12000);
 },2000);
}
function finishJaegwanCall(){
 clearJaegwanCallTimers();
 const timer=document.getElementById('jaegwanTimer');if(timer)timer.textContent='통화 종료';
 const dialogue=document.getElementById('jaegwanDialogue');if(dialogue)dialogue.textContent='통화가 종료되었습니다.';
 const controls=document.querySelector('.jaegwan-call-controls');if(controls)controls.style.visibility='hidden';
 const end=document.querySelector('.jaegwan-call-end');if(end){end.setAttribute('aria-label','최근 통화로 돌아가기');end.onclick=phone;}
}
